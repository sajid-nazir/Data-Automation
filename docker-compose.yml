services:
  sec-10k-fetcher:
    build: .
    image: sec-10k-fetcher:latest
    # Defaults to 1000:1000 (the image's appuser) - NOT your actual host UID/GID.
    # Bash does not export $UID/$GID to child processes by default, so this
    # variable substitution almost always falls through to the hardcoded default
    # regardless of your real user. If your host UID/GID aren't 1000, bind-mounted
    # ./output will be owned by a different user than you inside the container;
    # run `UID=$(id -u) GID=$(id -g) docker compose run ...` explicitly to fix that.
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      SEC_USER_AGENT: ${SEC_USER_AGENT:-SEC 10-K Fetcher sajidchnazir@gmail.com}
    volumes:
      - ./output:/app/output
    # Chromium uses /dev/shm for tab rendering; Docker's 64MB default is too small
    # for dense, image-heavy filings and causes silent rendering degradation or
    # crashes under memory pressure rather than a clear error.
    shm_size: "1gb"
    # No tickers here means the pipeline defaults to every company in TARGET_COMPANIES.
    # command: ["AAPL", "META"]
