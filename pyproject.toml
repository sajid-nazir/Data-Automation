[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sec-10k-fetcher"
version = "0.1.0"
description = "Fetches the latest SEC 10-K filings for target companies and converts them to PDF."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1.0",
    "playwright>=1.40,<2.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "mypy>=1.9",
    "ruff>=0.4",
]

[project.scripts]
sec-10k-fetch = "src.pipeline:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.ruff]
line-length = 100
target-version = "py310"
